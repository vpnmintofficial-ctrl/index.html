<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Загрузка...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    color: #fff;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }

  #gate {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
    z-index: 90;
    padding: 20px;
    text-align: center;
    cursor: pointer;
  }

  #gate .icon {
    font-size: 72px;
    margin-bottom: 20px;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.12); opacity: 0.7; }
  }

  #gate h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  #gate p {
    font-size: 16px;
    color: #888;
    max-width: 340px;
    line-height: 1.4;
    animation: blink 1.5s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  #video {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    display: none;
    z-index: 50;
    background: #000;
  }

  body.playing #video { display: block; }
  body.playing #gate { display: none !important; }
</style>
</head>
<body>

<div id="gate">
  <div class="icon">⚠️</div>
  <h1>Внимание</h1>
  <p>Нажмите в любом месте экрана, чтобы продолжить</p>
</div>

<video id="video" playsinline preload="auto" webkit-playsinline>
  <source src="video.mp4" type="video/mp4">
  Твой браузер не поддерживает видео.
</video>

<script>
  const video = document.getElementById('video');
  let started = false;

  function triggerScream(e) {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }
    if (started) return;
    started = true;

    document.body.classList.add('playing');
    video.volume = 1.0;
    video.muted = false;

    const playPromise = video.play();
    if (playPromise !== undefined) {
      playPromise.catch(err => {
        console.warn('Autoplay blocked:', err);
        const retry = () => {
          video.volume = 1.0;
          video.muted = false;
          video.play().catch(() => {});
        };
        document.body.addEventListener('click', retry, { once: true });
        document.body.addEventListener('touchstart', retry, { once: true });
      });
    }

    if (video.requestFullscreen) {
      video.requestFullscreen().catch(() => {});
    } else if (video.webkitRequestFullscreen) {
      video.webkitRequestFullscreen();
    } else if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen();
    }

    const params = new URLSearchParams(window.location.search);
    const uid = params.get('u') || 'anon';
    console.log('Screamer opened by:', uid);
  }

  document.body.addEventListener('click', triggerScream);
  document.body.addEventListener('touchstart', triggerScream, { passive: false });
  document.getElementById('gate').addEventListener('click', triggerScream);
  document.getElementById('gate').addEventListener('touchstart', triggerScream, { passive: false });
</script>

</body>
</html>
